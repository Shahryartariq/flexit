version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      framework:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
      supabase:
        patterns: ["@supabase/*", "supabase"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next", "@supabase/*", "supabase"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
